<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- ?v= forces browsers to drop any icon cached from an older site on the same address -->
    <link rel="icon" href="/favicon.ico?v=2" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=2" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#15110e" />
    <meta name="description" content="Bismillah Chicken Center, Bhimavaram — wholesale poultry management." />
    <title>Bismillah Chicken Center</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Playfair+Display:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="preload" as="image" href="/logo.png" />
    <style>
      /* Painted before React loads so there is never a white flash. */
      html, body { background: #15110e; }
      #boot { position: fixed; inset: 0; display: grid; place-items: center; background: radial-gradient(circle at 50% 45%, #2e251e, #15110e 65%); z-index: 0; }
      #boot img { width: 120px; height: 120px; border-radius: 50%; opacity: .9; box-shadow: 0 0 60px rgba(201,151,63,.35); }
    </style>
  </head>
  <body>
    <div id="root"><div id="boot"><img src="/logo.png" alt="" /></div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
